<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Flytte Admin</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .plate-tag { white-space: nowrap; }
  td .small.muted { white-space: nowrap; }
  nav.side { background: #000; color: #fff; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  nav.side .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -.04em; margin: 0 0 22px 12px; }
  nav.side button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; color: rgba(255,255,255,.8); font: 700 1rem var(--body); padding: 11px 12px; border-radius: 10px; cursor: pointer; }
  nav.side button[aria-current="page"] { background: rgba(255,255,255,.14); color: #fff; }
  nav.side .count { flex: none; align-self: center; line-height: 1.5; margin-left: 8px; background: var(--gold); color: #000; border-radius: 999px; padding: 0 8px; font-size: .8rem; }
  main { padding: 30px 34px; max-width: 1200px; width: 100%; }
  main h1 { font-size: 2.2rem; letter-spacing: -.04em; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 14px 0 20px; }
  .kpi { background: var(--surface); border-radius: 14px; padding: 16px 18px; }
  .kpi b { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
  #liveMap { height: 440px; border-radius: 14px; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; background: var(--bg); font-size: .93rem; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--ink-2); font-size: .82rem; border-bottom: 1px solid var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  .table-wrap { overflow-x: auto; }
  .price input { width: 100px; padding: 8px; }
  .sos-live { background: var(--stop); color: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; font-weight: 700; }
  .m-top, .m-tabs, .fold-btn { display: none; }
  .count.red { background: var(--stop); color: #fff; }

  /* ---------- Phones ---------- */
  @media (max-width: 800px) {
    html, body { background: #F2F2F7 !important; }
    .table-wrap, table.cards { background: transparent !important; border: 0 !important; box-shadow: none !important; }
    .shell { display: block; min-height: 100vh; }
    nav.side { display: none; }
    main { padding: 6px 16px calc(96px + env(safe-area-inset-bottom)); max-width: none; }
    main h1 { font-size: 1.75rem; margin: 8px 0 4px; }
    main h2 { font-size: 1.15rem; margin: 22px 0 8px; }
    main > p.muted, main .muted { font-size: .88rem; }

    /* top bar: brand, plus a red SOS pill when an alert is open */
    .m-top { display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 50; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: rgba(242,242,247,.86); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); }
    .m-top b { font-size: 1.05rem; letter-spacing: -.02em; }
    .m-top b span { color: var(--ink-2); font-weight: 600; }
    .m-sos { margin-left: auto; background: var(--stop); color: #fff; font-weight: 800; font-size: .8rem; padding: 5px 11px; border-radius: 999px; text-decoration: none; animation: sosPulse 1.6s ease-in-out infinite; }
    @keyframes sosPulse { 50% { box-shadow: 0 0 0 6px rgba(200,50,43,.18); } }

    /* bottom tabs */
    .m-tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      border-top: .5px solid rgba(0,0,0,.12); }
    .m-tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 6px 0 4px; font: 600 .68rem var(--font); color: #8E8E93; cursor: pointer; }
    .m-tabs button[aria-current="page"] { color: var(--ink); }
    .m-tabs button[aria-current="page"] .m-ic { background: var(--brand); }
    .m-ic { position: relative; display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s; }
    .m-ic .i { width: 22px; height: 22px; }
    .m-count { position: absolute; top: -3px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--stop); color: #fff; font: 700 .66rem/18px var(--font); font-style: normal; text-align: center; box-shadow: 0 0 0 2px #fff; }

    /* More sheet */
    .more-sheet h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .more-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; background: none; border: 0; border-bottom: .5px solid var(--line); font: 600 1rem var(--font); color: var(--ink); text-align: left; cursor: pointer; }
    .more-row:last-child { border-bottom: 0; }
    .more-row.on { color: var(--accent-ink, #8A6400); }
    .more-row .mr-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #F2F2F7; flex: none; }
    .more-row .mr-ic .i { width: 19px; height: 19px; }
    .more-row.out { color: var(--stop); }
    .more-row > .i { width: 16px; height: 16px; color: #C7C7CC; }
    .more-row .count { background: var(--gold); color: #000; border-radius: 999px; padding: 1px 8px; font-size: .78rem; }

    /* figures: two neat columns */
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 16px; }
    .kpi { background: #fff; padding: 12px 14px; border-radius: 16px; }
    .kpi b { font-size: 1.22rem; margin-top: 2px; }
    .kpis:has(input), .kpis:has(select) { grid-template-columns: 1fr; background: #fff; border-radius: 16px; padding: 14px; gap: 12px; }
    #liveMap { height: 300px; border-radius: 16px; }

    /* long notes fold to two lines */
    p.fold:not(.open) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0; }
    .fold-btn { display: inline-block; background: none; border: 0; padding: 2px 0 8px; font: 700 .85rem var(--font); color: var(--ink); cursor: pointer; }

    /* tables become cards */
    .table-wrap { overflow: visible; }
    table.cards, table.cards tbody { display: block; background: none; }
    table.cards thead { display: none; }
    table.cards tr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    table.cards tr[style*="background"] { box-shadow: inset 0 0 0 1.5px rgba(200,50,43,.45); }
    table.cards td { display: block; padding: 0; border: 0; min-width: 0; font-size: .9rem; overflow-wrap: anywhere; }
    table.cards td::before { content: attr(data-label); display: block; font-size: .7rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #8E8E93; margin-bottom: 2px; }
    table.cards td[data-label=""]::before, table.cards td.c-head::before, table.cards td.c-actions::before { display: none; }
    table.cards td.c-head { grid-column: 1 / -1; font-size: 1rem; padding-bottom: 8px; border-bottom: .5px solid var(--line); }
    table.cards td.c-wide { grid-column: 1 / -1; }
    table.cards td.c-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: .5px solid var(--line); white-space: normal !important; }
    table.cards td.c-actions .btn { flex: 1 1 calc(50% - 4px); min-height: 40px; margin: 0; }
    table.cards td.c-empty { grid-column: 1 / -1; text-align: center; color: var(--ink-2); padding: 18px 0; }
    table.cards td input:not([type=checkbox]), table.cards td select { width: 100% !important; min-width: 0 !important; padding: 9px 10px; }
    table.cards tr.faded { opacity: .6; }
    .trip-id { margin-right: 6px; }

    /* settings: Save stays in reach while scrolling */
    .save-sticky { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 40; width: 100%; min-height: 50px; box-shadow: 0 8px 24px rgba(0,0,0,.18); margin-top: 8px; }

    /* photo checks */
    .check-card { padding: 14px; border-radius: 16px; background: #fff; }
    .doc-thumbs.four { grid-template-columns: 1fr 1fr; }
    .doc-thumbs img, .doc-thumbs .noimg { height: 120px !important; }
    .cc-head { flex-wrap: wrap; gap: 6px; }
    .row:has(> #addDriver) { flex-wrap: wrap; }
    #addDriver { width: 100%; margin-top: 10px; }
    .card { border-radius: 16px; }
  }
</style>
</head>
<body data-app="admin">
<div id="root"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/maplibre.js"></script>
<script defer src="/vendor/maplibre-leaflet/leaflet-maplibre-gl.js"></script>
<script defer src="/socket.io/socket.io.js"></script>
<script defer src="/js/common.js"></script>
<script defer src="/js/admin.js"></script>
</body>
</html>
