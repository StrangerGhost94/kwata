<script>/* Signed out: the welcome and sign-in screens are dark, so launch dark too (iOS colours the strip under the clock from the launch screen). */try{if(!(localStorage.getItem('flytte_driver')||localStorage.getItem('kwata_driver')))document.documentElement.classList.add('launch-dark')}catch(e){}</script>
<script>/* Time of day, for the launch photo's light (morning, day, evening, night). */try{var h=new Date().getHours();document.documentElement.classList.add(h>=6&&h<10?'tod-morning':h>=10&&h<17?'tod-day':h>=17&&h<19?'tod-evening':'tod-night')}catch(e){}</script>
<script>/* Appearance chosen in Settings: applied before the first frame, so there is no flash. */try{var t=localStorage.getItem('flytte_theme');if(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('theme-dark');document.querySelector('meta[name=theme-color]').content='#000000'}}catch(e){}</script>
