<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3954">
<title>Kwata Driver</title>
<link rel="manifest" href="/manifest-driver.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .online-toggle { width: 100%; padding: 20px; font: 800 1.25rem var(--display); border-radius: 18px; }
  .stat-row { display: flex; gap: 10px; margin: 12px 0; }
  .stat { flex: 1; background: var(--mist); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font: 800 1.15rem var(--display); }
  .countdown { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; }
  .countdown > i { display: block; height: 100%; background: var(--vest); transition: width 1s linear; }
  .offer-fare { font: 800 clamp(1.8rem, 9vw, 2.4rem)/1 var(--display); color: var(--lake); white-space: nowrap; }
  .pin-input { font: 800 2rem var(--display); letter-spacing: .4em; text-align: center; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; background: var(--card); padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .status-pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-2); }
  .status-pill.on i { background: var(--go); }
</style>
</head>
<body data-app="driver">
<div id="root"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/driver.js"></script>
</body>
</html>
