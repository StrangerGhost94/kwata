<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Follow a Flytte ride</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/dark.css">
<script>/* Same light or dark look as the app: the rider's choice, or the phone's setting. */try{var t=localStorage.getItem('flytte_theme');if(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('theme-dark');var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#000000'}}catch(e){}</script>
</head>
<body data-app="track">
<div class="app">
  <div id="map" aria-label="Map"></div>
  <div class="topbar"><a class="pill-chip wordmark" href="/" style="text-decoration:none;font-size:1.1rem;padding:6px 16px 6px 8px"><svg class="fl-mark" width="11.7" height="22" viewBox="0 0 76.82 145.05" aria-hidden="true"><path class="f1" fill="#073B42" d="M76.82 0V21.29C76.82 27.37 73.58 32.99 68.31 36.03L26.95 59.91C23.05 62.16 7.5 68.5 0 86.42V57.23C0 49.27 4.25 41.9 11.15 37.92L26.95 28.8Z"/><path class="f2" fill="#0E6E73" d="M68.7 52.48V72.14C68.7 79.23 64.92 85.78 58.78 89.33L38.18 101.22C31.23 105.24 26.95 112.65 26.95 120.68V145.05H0V116.04C0 101.26 7.89 87.6 20.69 80.2L26.95 76.59Z"/></svg><span class="fl-word">flytte</span></a></div>
  <section class="sheet" id="sheet" aria-live="polite"><div class="grabber"></div><i class="sk" style="width:60%;height:24px"></i><i class="sk" style="width:85%;height:12px;margin-top:12px"></i><i class="sk" style="width:100%;height:56px;margin-top:16px"></i></section>
</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/maplibre.js"></script>
<script defer src="/vendor/maplibre-leaflet/leaflet-maplibre-gl.js"></script>
<script defer src="/socket.io/socket.io.js"></script>
<script defer src="/js/common.js"></script>
<script>
// Runs once the deferred scripts above have loaded.
document.addEventListener('DOMContentLoaded', function () {
  const token = location.pathname.split('/').pop();
  const sheet = K.$('#sheet');
  const map = K.map('map');
  let car, line, trip;
  const sock = io();
  sock.on('connect', () => sock.emit('track:join', { token }, (r) => {
    if (!r.ok) { sheet.innerHTML = '<div class="checker"></div><h2>Trip not found</h2><p class="muted">This link may be wrong or the trip has ended.</p>'; return; }
    update(r.trip);
  }));
  sock.on('trip:update', update);
  sock.on('driver:location', (p) => move(p));

  function update(t) {
    const first = !trip; trip = t;
    if (first) {
      K.route(t.pickup, t.drop).then((r) => {
        line = K.drawRoute(map, r.coords);
        L.marker([t.pickup.lat, t.pickup.lng], { icon: K.divIcon('<div class="pin-ci"></div>', [16, 16]) }).addTo(map);
        L.marker([t.drop.lat, t.drop.lng], { icon: K.divIcon('<div class="pin-sq"></div>', [16, 16]) }).addTo(map);
        map.fitBounds(line.bounds(), { paddingTopLeft: [30, 80], paddingBottomRight: [30, sheet.offsetHeight + 20] });
      });
    }
    if (t.driver && t.driver.location) move(t.driver.location);
    const label = { requested: 'Looking for a ride', accepted: 'Ride on the way to pickup', arrived: 'Ride has arrived at pickup', in_progress: 'On trip', completed: 'Arrived safely ✅', cancelled: 'Trip cancelled', no_drivers: 'No ride found' }[t.status] || t.status;
    const d = t.driver;
    sheet.innerHTML = `<div class="grabber"></div>
      <h2>${label}</h2>
      <p class="small muted">You’re following ${K.esc(t.rider.name)}’s Flytte trip live.</p>
      ${d ? `<div class="driver-card" style="margin:12px 0"><span class="photo">${d.photo ? `<img src="${K.esc(d.photo)}" alt="">` : K.initials(d.name)}</span>
        <span class="grow"><b style="display:block">${K.esc(d.name)}</b><span class="small muted">${K.esc(d.vehicle || '')}</span></span>
        <span style="text-align:right"><span class="plate-chip">${K.esc(d.plate)}</span><span style="display:block;width:70px;height:44px;margin-top:4px">${K.artFor(null, d.vehicleType)}</span></span></div>` : ''}
      <div class="stops">
        <div class="stop"><span class="s-ic"><span class="dot-pick"></span></span><span><small>From</small><b>${K.esc(t.pickup.address)}</b></span></div>
        <div class="stop"><span class="s-ic"><span class="dot-drop"></span></span><span><small>To</small><b>${K.esc(t.drop.address)}</b></span></div>
      </div>
      <p class="tiny faint">If something looks wrong, call ${K.esc(t.rider.name)} first. In an emergency call 999.</p>`;
  }
  function move(p) {
    if (!trip || !trip.driver) return;
    if (!car) car = K.vehicle(map, p, trip.driver.vehicleType === 'car' ? 'car' : 'boda', p.heading || 0);
    else car.moveTo(p.lat, p.lng, p.heading);
  }
});
</script>
</body>
</html>
