<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Follow a Kwata ride</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-app="track">
<div class="app">
  <div id="map" aria-label="Map"></div>
  <div class="topbar"><a class="pill-chip wordmark" href="/" style="text-decoration:none;font-size:1.1rem">Kwata</a></div>
  <section class="sheet" id="sheet" aria-live="polite"><div class="grabber"></div><p class="muted">Loading trip…</p></section>
</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script>
(function () {
  const token = location.pathname.split('/').pop();
  const sheet = K.$('#sheet');
  const map = K.map('map');
  let car, line, trip;
  const sock = io();
  sock.on('connect', () => sock.emit('track:join', { token }, (r) => {
    if (!r.ok) { sheet.innerHTML = '<div class="checker"></div><h2>Trip not found</h2><p class="muted">This link may be wrong or the trip has ended.</p>'; return; }
    update(r.trip);
  }));
  sock.on('trip:update', update);
  sock.on('driver:location', (p) => move(p));

  function update(t) {
    const first = !trip; trip = t;
    if (first) {
      K.route(t.pickup, t.drop).then((r) => {
        line = K.drawRoute(map, r.coords);
        L.marker([t.pickup.lat, t.pickup.lng], { icon: K.divIcon('<div class="pin-ci"></div>', [16, 16]) }).addTo(map);
        L.marker([t.drop.lat, t.drop.lng], { icon: K.divIcon('<div class="pin-sq"></div>', [16, 16]) }).addTo(map);
        map.fitBounds(line.bounds(), { paddingTopLeft: [30, 80], paddingBottomRight: [30, sheet.offsetHeight + 20] });
      });
    }
    if (t.driver && t.driver.location) move(t.driver.location);
    const label = { requested: 'Looking for a driver', accepted: 'Driver on the way to pickup', arrived: 'Driver has arrived at pickup', in_progress: 'On the way', completed: 'Arrived safely ✅', cancelled: 'Trip cancelled', no_drivers: 'No driver found' }[t.status] || t.status;
    sheet.innerHTML = `<div class="grabber"></div>
      <div class="eta-big">${label}</div>
      <p class="small muted">${K.esc(t.rider.name)} is travelling from ${K.esc(t.pickup.address)} to <b>${K.esc(t.drop.address)}</b></p>
      ${t.driver ? `<div class="driver-block"><span class="car-art">${K.artFor(null, t.driver.vehicleType)}</span><span class="grow"><span class="plate" style="display:block">${K.esc(t.driver.plate)}</span><span class="small muted">${K.esc(t.driver.vehicle)}</span></span><span class="avatar">${K.initials(t.driver.name)}</span></div>` : ''}
      <p class="tiny faint">If something looks wrong, call ${K.esc(t.rider.name)} first. In an emergency call 999.</p>`;
  }
  function move(p) {
    if (!trip || !trip.driver) return;
    if (!car) car = K.vehicle(map, p, trip.driver.vehicleType === 'car' ? 'car' : 'boda', p.heading || 0);
    else car.moveTo(p.lat, p.lng, p.heading);
  }
})();
</script>
</body>
</html>
